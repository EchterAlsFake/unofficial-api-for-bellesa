[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "unofficial-api-for-bellesa"
version = "1.0.0"
description = "An asynchronous Python API wrapper for bellesa.co"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Johannes Habel", email = "EchterAlsFake@proton.me"}]
dependencies = ["eaf-base-api[hls]>=4.2.6", "selectolax"]

[project.scripts]
bellesa_api = "bellesa_api.api:main"

[project.urls]
Documentation = "https://docs.echteralsfake.me/bellesa"
Repository = "https://github.com/EchterAlsFake/unofficial-api-for-bellesa"
"Support me on Ko-Fi" = "https://ko-fi.com/EchterAlsFake"

[tool.uv.build-backend]
module-name = "bellesa_api"
module-root = ""
source-include = ["README.md", "LICENSE", "MANIFEST.in"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
junit_family = "legacy"
testpaths = ["bellesa_api/tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
